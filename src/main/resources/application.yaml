spring:
  application:
    name: spring-ai-project

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        options:
          model: codellama:latest
          temperature: 0.7

      # ADD THIS BLOCK (CRITICAL)
      embedding:
        model: nomic-embed-text:latest

  datasource:
    url: jdbc:mysql://localhost:3306/spring_ai
    username: root
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: always

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081